<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>A-A-A-A Match 3 RPG</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4A2346">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Общие части фишек: градиент «Внутреннего ободка» и обрезка «Полос» по сквирклу (GlassOverlays) -->
<svg id="gemDefs" width="0" height="0" aria-hidden="true">
  <defs>
    <linearGradient id="gemRimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </linearGradient>
    <!-- «Верхний глянец» (GlassOverlays): белый .45 → .06 сверху вниз -->
    <linearGradient id="gemGlossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <clipPath id="gemClip"><polygon id="gemClipShape" points=""/></clipPath>
  </defs>
</svg>

<!-- Главное меню -->
<section id="menu" class="screen active">
  <div class="logo">
    <h1>A-A-A-A</h1>
    <div class="ribbon">Match 3 RPG</div>
  </div>
  <nav class="menuButtons">
    <div id="heroCard" class="heroCard" hidden>
      <div class="heroCardHead"><b id="heroCardName"></b><span id="heroCardSlot"></span><button id="btnCharacter" class="btn stone heroCardBtn" type="button">Персонаж</button></div>
      <dl id="heroCardStats"></dl>
      <div id="heroCardChars" class="statChips"></div>
    </div>
    <button id="btnStart" class="btn green big" type="button">
      <span id="btnStartLabel">Начать игру</span>
      <small id="btnStartSub"></small>
    </button>
    <div class="menuRow">
      <button id="btnCharacters" class="btn stone" type="button">Персонажи</button>
      <button id="btnSettings" class="btn stone" type="button">Настройки</button>
      <button id="btnCamp" class="btn green" type="button" hidden>Лагерь</button>
      <button id="btnExit" class="btn red" type="button">Выход</button>
    </div>
  </nav>
  <button id="ver" type="button"></button>
</section>

<!-- Персонажи: три ячейки -->
<section id="characters" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="panel">
    <p class="hint">Выберите персонажа или создайте нового</p>
    <div id="slotList"></div>
    <button id="createNewHero" class="btn green createNewHero" type="button"><span>+ Создать нового персонажа</span><small></small></button>
  </div>
</section>

<!-- Создание персонажа: «Происхождение» (фракции, расы, Пресса) → «Класс» (класс, имя, пол) -->
<section id="create" class="screen">
  <header class="screenHead createHead">
    <button id="createBack" class="btn stone round back" type="button" aria-label="Назад"></button>
    <button id="createRandom" class="btn stone square createRandom" type="button" aria-label="Случайно" data-tip="Случайный персонаж">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="5" y="5" width="22" height="22" rx="5" fill="var(--ui-parchment)" stroke="var(--ui-outline)" stroke-width="2"/>
        <circle cx="11" cy="11" r="2.2" fill="var(--ui-outline)"/><circle cx="21" cy="11" r="2.2" fill="var(--ui-outline)"/>
        <circle cx="16" cy="16" r="2.2" fill="var(--ui-danger)"/>
        <circle cx="11" cy="21" r="2.2" fill="var(--ui-outline)"/><circle cx="21" cy="21" r="2.2" fill="var(--ui-outline)"/>
      </svg>
    </button>
  </header>
  <div class="createBody">
    <div id="createLeft" class="panel"></div>
    <div id="createRight" class="panel"></div>
  </div>
</section>

<!-- Настройки -->
<section id="settings" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="panel">
    <div class="settingsList">
      <label class="setRow range"><span>Музыка <b id="val-music"></b></span><input id="set-music" type="range" min="0" max="100" step="5"></label>
      <label class="setRow range"><span>Звуки <b id="val-sound"></b></span><input id="set-sound" type="range" min="0" max="100" step="5"></label>
      <label class="setRow"><span>Вибрация</span><input id="set-vibration" type="checkbox" class="switch"></label>
      <label class="setRow"><span>Полноэкранный режим</span><input id="set-fullscreen" type="checkbox" class="switch"></label>
      <label class="setRow"><span>Оповещения</span><input id="set-notifications" type="checkbox" class="switch"></label>
      <label class="setRow"><span>Обучение для всех персонажей</span><input id="set-tutorialAll" type="checkbox" class="switch"></label>
      <label class="setRow" id="rowTutorialHero"><span>Обучение для текущего персонажа</span><input id="set-tutorialHero" type="checkbox" class="switch"></label>
      <div class="setRow"><button id="btnInstall" class="btn green" type="button">Установить приложение</button></div>
      <div class="setRow"><button id="btnResetSaves" class="btn red" type="button">Удалить всех персонажей</button></div>
    </div>
  </div>
</section>

<!-- Бой: слева игрок, по центру поле на всю высоту, справа враг и кнопки -->
<section id="game" class="screen">
  <aside class="gameSide">
    <div id="heroPanel" class="fighter"></div>
    <!-- Навыки: кнопки активных (за ману) и строка пассивных — js/renderSkillBar.js -->
    <div id="skillBar"></div>
    <!-- Слева внизу: «Фишки» и под ней чат-лог боя на 5 строк (js/logBattle.js) -->
    <div class="battleCorner">
    <button id="btnLegend" class="btn stone square legendBig" aria-label="Фишки" data-tip="Фишки: что даёт каждая" type="button">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="3" width="26" height="26" rx="8" fill="var(--gem-amethyst)"/>
          <rect x="4.5" y="4.5" width="23" height="23" rx="7" fill="none" stroke="var(--gem-amethyst-light)" stroke-width="1" opacity=".7"/>
          <path d="M11.5 12.5 Q11.5 7.5 16 7.5 Q20.5 7.5 20.5 11.5 Q20.5 14.5 17.5 15.5 Q16 16.2 16 18.5" fill="none" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="16" cy="23.5" r="2" fill="var(--text-primary)"/>
        </svg>
      </button>
      <div id="battleLog" class="battleLog"></div>
    </div>
  </aside>
  <div class="boardWrap">
    <div id="board" class="board">
      <div id="boardCells"></div>
      <div id="boardGems"></div>
    </div>
  </div>
  <aside class="gameSide">
    <div id="enemyPanel" class="fighter enemy"></div>
    <!-- Навык врага: название, что делает, лор — js/renderEnemySkill.js -->
    <div id="enemySkill"></div>
    <div class="gameButtons">
      <!-- Меню боя: одна кнопка, по нажатию — список с иконками (js/toggleBattleMenu.js) -->
      <button id="btnBattleMenu" class="btn stone square" type="button" aria-label="Меню" data-tip="Меню" aria-expanded="false">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="6" y="7" width="20" height="4" rx="2" fill="var(--ui-parchment)"/>
          <rect x="6" y="14" width="20" height="4" rx="2" fill="var(--ui-parchment)"/>
          <rect x="6" y="21" width="20" height="4" rx="2" fill="var(--ui-parchment)"/>
        </svg>
      </button>
    </div>
    <div id="battleMenu" class="panel" hidden>
      <button id="btnCharGame" class="menuItem" type="button">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="9" r="5" fill="var(--ui-parchment)" stroke="var(--ui-outline)" stroke-width="2"/>
          <path d="M6 28 Q6 16 16 16 Q26 16 26 28 Z" fill="var(--ui-parchment)" stroke="var(--ui-outline)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M12 20 L16 24 L20 20" fill="none" stroke="var(--gem-topaz-dark)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Персонаж</span>
      </button>
      <button id="btnCampGame" class="menuItem" type="button" hidden>
        <span class="campIco"></span>
        <span>Лагерь</span>
      </button>
      <button id="btnJournalGame" class="menuItem" type="button">
        <span class="journalIco"></span>
        <span>Задания</span>
      </button>
      <button id="btnGlossaryGame" class="menuItem" type="button">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 6 Q10 4 16 7 Q22 4 27 6 L27 26 Q22 24 16 27 Q10 24 5 26 Z" fill="var(--ui-parchment)" stroke="var(--ui-outline)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M16 7 L16 27" stroke="var(--ui-outline)" stroke-width="2"/>
          <path d="M8 11 Q11 10 13 11 M8 15 Q11 14 13 15 M19 11 Q21 10 24 11 M19 15 Q21 14 24 15 M19 19 Q21 18 24 19" fill="none" stroke="var(--gem-topaz-dark)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Глоссарий</span>
      </button>
      <button id="btnMap" class="menuItem" type="button">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 7 L11 4 L21 7 L28 4 L28 25 L21 28 L11 25 L4 28 Z" fill="var(--ui-parchment)" stroke="var(--ui-outline)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M11 4 L11 25 M21 7 L21 28" stroke="var(--gem-topaz-dark)" stroke-width="1.5"/>
          <path d="M7 19 Q12 13 16 17 T24 12" fill="none" stroke="var(--gem-topaz-dark)" stroke-width="1.5" stroke-dasharray="2 2"/>
          <path d="M21.5 9.5 L26.5 14.5 M26.5 9.5 L21.5 14.5" stroke="var(--ui-danger)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M6 9 L10 7.3" stroke="var(--gem-pearl-light)" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
        </svg>
        <span>Карта врагов</span>
      </button>
      <button id="btnCheatGame" class="menuItem" type="button">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="4" y="4" width="24" height="24" rx="7" fill="var(--gem-amethyst)"/>
          <path d="M18 5 L9 18 L15 18 L13 27 L23 13 L17 13 Z" fill="var(--gem-topaz)" stroke="var(--ui-outline)" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span>Читер</span>
      </button>
      <button id="btnSurrender" class="menuItem" type="button">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M8 4 L8 29" stroke="var(--ui-metal)" stroke-width="3" stroke-linecap="round"/>
          <path d="M9.5 5 Q15 3 19 6 Q23 9 27 7 L27 18 Q23 20 19 17 Q15 14 9.5 16 Z" fill="var(--gem-pearl)"/>
          <path d="M9.5 13 Q15 11 19 14 Q23 17 27 15 L27 18 Q23 20 19 17 Q15 14 9.5 16 Z" fill="var(--gem-pearl-dark)"/>
        </svg>
        <span>Сдаться</span>
      </button>
      <button id="gameToMenu" class="menuItem" type="button">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 15 L16 5 L28 15 L25 15 L25 27 L7 27 L7 15 Z" fill="var(--ui-parchment)" stroke="var(--ui-outline)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M13 27 L13 19 L19 19 L19 27" fill="var(--gem-topaz-dark)" stroke="var(--ui-outline)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M8 13.5 L16 7 L24 13.5" fill="none" stroke="var(--ui-danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>В главное меню</span>
      </button>
    </div>
  </aside>
</section>

<!-- Карта врагов: 9 локаций — по три у фракций и три нейтральные (данные — js/zones.js) -->
<section id="map" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="mapBody">
    <div id="zoneList" class="panel"></div>
    <div class="panel zonePanel">
      <div id="zoneInfo"></div>
      <div id="enemyList"></div>
    </div>
  </div>
</section>

<!-- Персонаж: слева шапка, кукла, руны, характеристики и вкладки; справа инвентарь (js/renderCharacter.js) -->
<section id="character" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="mapBody">
    <div class="panel charCol charColLeft"><div id="charLeft" class="charScroll"></div></div>
    <div class="panel charCol charColRight"><div id="charRight" class="charScroll"></div></div>
  </div>
</section>

<!-- Бункер: вступление и места — торговец, доска заданий (js/renderBunker.js) -->
<!-- Лагерь: общий для аккаунта, постройки -->
<!-- Реестр Героев и Пострадавших (парагон аккаунта): паутинка компенсаций и описание -->
<section id="paragon" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="mapBody">
    <div class="panel charCol paragonColLeft"><div id="paragonLeft" class="pgLeft"></div></div>
    <div class="panel charCol charColRight"><div id="paragonRight" class="charScroll"></div></div>
  </div>
</section>

<section id="camp" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div id="campBody"></div>
</section>

<section id="bunker" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div id="bunkerBody"></div>
</section>

<!-- Торговец: слева прилавок завхоза, справа сумка героя (js/renderShop.js) -->
<!-- Банк персонажа: ячейки банка, гнёзда сумок, сумка героя -->
<!-- Общий склад лагеря: вещи и изолента для всех персонажей аккаунта -->
<section id="stash" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="mapBody">
    <div class="panel charCol shopColLeft"><div id="stashLeft" class="charScroll"></div></div>
    <div class="panel charCol charColRight"><div id="stashRight" class="charScroll"></div></div>
  </div>
</section>

<section id="bank" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="mapBody">
    <div class="panel charCol shopColLeft"><div id="bankLeft" class="charScroll"></div></div>
    <div class="panel charCol charColRight"><div id="bankRight" class="charScroll"></div></div>
  </div>
</section>

<section id="shop" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="mapBody">
    <div class="panel charCol shopColLeft"><div id="shopLeft" class="charScroll"></div></div>
    <div class="panel charCol charColRight"><div id="shopRight" class="charScroll"></div></div>
  </div>
</section>

<!-- Доска объявлений: слева объявления, справа взятые задания (js/renderQuests.js) -->
<!-- Журнал заданий: слева список по категориям, справа выбранное задание -->
<section id="journal" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="mapBody">
    <div class="panel charCol journalColLeft"><div id="journalLeft" class="charScroll"></div></div>
    <div class="panel charCol charColRight"><div id="journalRight" class="charScroll"></div></div>
  </div>
</section>

<section id="quests" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="mapBody">
    <div class="panel charCol shopColLeft"><div id="questsLeft" class="charScroll"></div></div>
    <div class="panel charCol charColRight"><div id="questsRight" class="charScroll"></div></div>
  </div>
</section>

<!-- Глоссарий-книга: разделы слева, страница справа (разделы — js/glossarySections.js) -->
<section id="glossary" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
  </header>
  <div class="mapBody">
    <div id="glossaryTabs" class="panel"></div>
    <div id="glossaryPage" class="panel"></div>
  </div>
</section>

<!-- Шуточная заставка после создания персонажа (текст — js/introText.js) -->
<section id="intro" class="screen">
  <div id="introStars"></div>
  <div class="introView"><div id="introCrawl"></div></div>
  <button id="introSkip" class="btn stone" type="button">Пропустить</button>
</section>

<!-- Экран после «Выхода», если браузер не дал закрыть вкладку -->
<section id="bye" class="screen">
  <div class="logo">
    <h1>A-A-A-A</h1>
    <div class="ribbon">Match 3 RPG</div>
  </div>
  <div class="panel">
    <p class="hint">Игра закрыта. Можно закрыть вкладку.</p>
    <button id="btnReturn" class="btn green" type="button">Вернуться</button>
  </div>
</section>

<!-- Шуточная «оплата»: нарисованная карта без полей ввода, ничего не вводится и не сохраняется (js/openPayJoke.js) -->
<div id="payJoke" class="modal">
  <div class="modalBox">
    <div class="ribbon">Шадап эд тейк май мани</div>
    <div class="panel">
      <div class="jokeCard" aria-hidden="true">
        <span class="jokeChip"></span>
        <span class="jokeNum">••••  ••••  ••••  ••••</span>
        <span class="jokeRow"><span>ММ/ГГ</span><span>CVC •••</span></span>
        <span class="jokeBank">Банк «Последний рубль»</span>
      </div>
      <p class="jokeNote">Введите данные карты, и мы ничего не пришлём.</p>
      <button id="payJokeNo" class="btn red" type="button">Я терпила</button>
    </div>
  </div>
</div>

<!-- Читер: уровень, изолента и прибавка к характеристикам текущего героя (js/renderCheat.js) -->
<div id="cheat" class="modal">
  <div class="modalBox">
    <div class="ribbon">Читер</div>
    <div class="panel">
      <button id="cheatClose" class="btn red round close" type="button" aria-label="Закрыть"></button>
      <div id="cheatBody"></div>
    </div>
  </div>
</div>

<!-- Враг: по касанию на его панель в бою (js/openEnemyInfo.js) -->
<div id="enemyInfo" class="modal">
  <div class="modalBox">
    <div class="ribbon" id="enemyInfoTitle"></div>
    <div class="panel">
      <button id="enemyInfoClose" class="btn red round close" type="button" aria-label="Закрыть"></button>
      <div id="enemyInfoBody"></div>
    </div>
  </div>
</div>

<!-- Предмет: по касанию на вещь в сумке или на кукле (js/openItemInfo.js) -->
<div id="itemInfo" class="modal">
  <div class="modalBox">
    <div class="ribbon" id="itemInfoTitle"></div>
    <div class="panel">
      <button id="itemInfoClose" class="btn red round close" type="button" aria-label="Закрыть"></button>
      <div id="itemInfoBody"></div>
      <div id="itemInfoButtons" class="confirmButtons"></div>
    </div>
  </div>
</div>

<div id="changelog" class="modal">
  <div class="modalBox">
    <div class="ribbon">Список изменений</div>
    <div class="panel">
      <button id="changelogClose" class="btn red round close" type="button" aria-label="Закрыть"></button>
      <div id="changelogList"></div>
    </div>
  </div>
</div>

<!-- Подсказка «Фишки»: что даёт каждая фишка в бою -->
<div id="gemLegend" class="modal">
  <div class="modalBox">
    <div class="ribbon">Фишки</div>
    <div class="panel">
      <button id="gemLegendClose" class="btn red round close" type="button" aria-label="Закрыть"></button>
      <div id="gemLegendList"></div>
      <div class="legendFoot">
        <p id="gemLegendNote"></p>
        <button id="gemLegendMore" class="btn stone" type="button">Весь глоссарий</button>
      </div>
    </div>
  </div>
</div>

<!-- Подсказка (showTip / attachTip) -->
<div id="tip" hidden></div>
<!-- Обучение: кружок вокруг элемента, стрелка и пояснение (js/showTutorial.js) -->
<div id="tutorial" hidden>
  <div class="tutRing"></div>
  <svg class="tutArrow" aria-hidden="true"><defs><marker id="tutHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--ui-reward)"/></marker></defs><line marker-end="url(#tutHead)"/></svg>
  <div class="tutBubble panel"><p></p><div class="tutBtns"><button class="btn stone tutHide" type="button">Скрыть обучение</button><button class="btn green tutOk" type="button">Понятно</button></div></div>
</div>

<div id="confirm" class="modal">
  <div class="modalBox">
    <div class="panel">
      <p id="confirmText"></p>
