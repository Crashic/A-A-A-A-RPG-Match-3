<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>A-A-A-A Match 3 RPG</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4A2346">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Общие части фишек: градиент «Внутреннего ободка» и обрезка «Полос» по сквирклу (GlassOverlays) -->
<svg id="gemDefs" width="0" height="0" aria-hidden="true">
  <defs>
    <linearGradient id="gemRimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </linearGradient>
    <clipPath id="gemClip"><polygon id="gemClipShape" points=""/></clipPath>
  </defs>
</svg>

<!-- Главное меню -->
<section id="menu" class="screen active">
  <div class="logo">
    <h1>A-A-A-A</h1>
    <div class="ribbon">Match 3 RPG</div>
  </div>
  <nav class="menuButtons">
    <div id="heroCard" class="heroCard" hidden>
      <div class="heroCardHead"><b id="heroCardName"></b><span id="heroCardSlot"></span></div>
      <dl id="heroCardStats"></dl>
    </div>
    <button id="btnStart" class="btn green big" type="button">
      <span id="btnStartLabel">Начать игру</span>
      <small id="btnStartSub"></small>
    </button>
    <div class="menuRow">
      <button id="btnCharacters" class="btn stone" type="button">Персонажи</button>
      <button id="btnSettings" class="btn stone" type="button">Настройки</button>
      <button id="btnGlossary" class="btn stone" type="button">Глоссарий</button>
      <button id="btnExit" class="btn red" type="button">Выход</button>
    </div>
  </nav>
  <button id="ver" type="button"></button>
</section>

<!-- Персонажи: три ячейки -->
<section id="characters" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
    <div class="ribbon">Персонажи</div>
  </header>
  <div class="panel">
    <p class="hint">Выберите персонажа или создайте нового</p>
    <div id="slotList"></div>
  </div>
</section>

<!-- Создание персонажа: «Происхождение» (фракции, расы, Пресса) → «Класс» (класс, имя, пол) -->
<section id="create" class="screen">
  <header class="screenHead createHead">
    <button id="createBack" class="btn stone round back" type="button" aria-label="Назад"></button>
    <div class="ribbon" id="createTitle"></div>
    <button id="createRandom" class="btn stone createRandom" type="button">Случайно</button>
  </header>
  <div class="createBody">
    <div id="createLeft" class="panel"></div>
    <div id="createRight" class="panel"></div>
  </div>
</section>

<!-- Настройки -->
<section id="settings" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
    <div class="ribbon">Настройки</div>
  </header>
  <div class="panel">
    <div class="settingsList">
      <label class="setRow range"><span>Музыка <b id="val-music"></b></span><input id="set-music" type="range" min="0" max="100" step="5"></label>
      <label class="setRow range"><span>Звуки <b id="val-sound"></b></span><input id="set-sound" type="range" min="0" max="100" step="5"></label>
      <label class="setRow"><span>Вибрация</span><input id="set-vibration" type="checkbox" class="switch"></label>
      <label class="setRow"><span>Полноэкранный режим</span><input id="set-fullscreen" type="checkbox" class="switch"></label>
      <label class="setRow"><span>Оповещения</span><input id="set-notifications" type="checkbox" class="switch"></label>
      <div class="setRow"><button id="btnResetSaves" class="btn red" type="button">Удалить всех персонажей</button></div>
    </div>
  </div>
</section>

<!-- Бой: слева игрок, по центру поле на всю высоту, справа враг и кнопки -->
<section id="game" class="screen">
  <aside class="gameSide">
    <div id="heroPanel" class="fighter"></div>
    <!-- Навыки: кнопки активных (за ману) и строка пассивных — js/renderSkillBar.js -->
    <div id="skillBar"></div>
  </aside>
  <div class="boardWrap">
    <div id="board" class="board">
      <div id="boardCells"></div>
      <div id="boardGems"></div>
    </div>
  </div>
  <aside class="gameSide">
    <div id="enemyPanel" class="fighter enemy"></div>
    <!-- Навык врага: название, что делает, лор — js/renderEnemySkill.js -->
    <div id="enemySkill"></div>
    <div class="gameButtons">
      <!-- Подсказка, какая фишка что даёт — js/openGemLegend.js -->
      <button id="btnLegend" class="btn stone square" type="button" aria-label="Фишки: что даёт каждая" title="Фишки: что даёт каждая">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="3" width="26" height="26" rx="8" fill="var(--gem-amethyst)"/>
          <rect x="4.5" y="4.5" width="23" height="23" rx="7" fill="none" stroke="var(--gem-amethyst-light)" stroke-width="1" opacity=".7"/>
          <path d="M11.5 12.5 Q11.5 7.5 16 7.5 Q20.5 7.5 20.5 11.5 Q20.5 14.5 17.5 15.5 Q16 16.2 16 18.5" fill="none" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="16" cy="23.5" r="2" fill="var(--text-primary)"/>
        </svg>
      </button>
      <!-- Временно, пока нет игрового меню: выход в главное меню (иконка-домик) -->
      <button id="gameToMenu" class="btn stone square" type="button" data-back aria-label="В меню" title="В меню">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 15 L16 5 L28 15 L25 15 L25 27 L7 27 L7 15 Z" fill="var(--ui-parchment)" stroke="var(--ui-outline)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M13 27 L13 19 L19 19 L19 27" fill="var(--gem-topaz-dark)" stroke="var(--ui-outline)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M8 13.5 L16 7 L24 13.5" fill="none" stroke="var(--ui-danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="btnGlossaryGame" class="btn stone square" type="button" aria-label="Глоссарий" title="Глоссарий">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 6 Q10 4 16 7 Q22 4 27 6 L27 26 Q22 24 16 27 Q10 24 5 26 Z" fill="var(--ui-parchment)" stroke="var(--ui-outline)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M16 7 L16 27" stroke="var(--ui-outline)" stroke-width="2"/>
          <path d="M8 11 Q11 10 13 11 M8 15 Q11 14 13 15 M19 11 Q21 10 24 11 M19 15 Q21 14 24 15 M19 19 Q21 18 24 19" fill="none" stroke="var(--gem-topaz-dark)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btnMap" class="btn stone square" type="button" aria-label="Карта врагов" title="Карта врагов">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 7 L11 4 L21 7 L28 4 L28 25 L21 28 L11 25 L4 28 Z" fill="var(--ui-parchment)" stroke="var(--ui-outline)" stroke-width="2" stroke-linejoin="round"/>
          <path d="M11 4 L11 25 M21 7 L21 28" stroke="var(--gem-topaz-dark)" stroke-width="1.5"/>
          <path d="M7 19 Q12 13 16 17 T24 12" fill="none" stroke="var(--gem-topaz-dark)" stroke-width="1.5" stroke-dasharray="2 2"/>
          <path d="M21.5 9.5 L26.5 14.5 M26.5 9.5 L21.5 14.5" stroke="var(--ui-danger)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M6 9 L10 7.3" stroke="var(--gem-pearl-light)" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
        </svg>
      </button>
    </div>
  </aside>
</section>

<!-- Карта врагов: 9 локаций — по три у фракций и три нейтральные (данные — js/zones.js) -->
<section id="map" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
    <div class="ribbon">Карта врагов</div>
  </header>
  <div class="mapBody">
    <div id="zoneList" class="panel"></div>
    <div class="panel zonePanel">
      <div id="zoneInfo"></div>
      <div id="enemyList"></div>
    </div>
  </div>
</section>

<!-- Глоссарий-книга: разделы слева, страница справа (разделы — js/glossarySections.js) -->
<section id="glossary" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
    <div class="ribbon">Глоссарий</div>
  </header>
  <div class="mapBody">
    <div id="glossaryTabs" class="panel"></div>
    <div id="glossaryPage" class="panel"></div>
  </div>
</section>

<!-- Шуточная заставка после создания персонажа (текст — js/introText.js) -->
<section id="intro" class="screen">
  <div id="introStars"></div>
  <div class="introView"><div id="introCrawl"></div></div>
  <button id="introSkip" class="btn stone" type="button">Пропустить</button>
</section>

<!-- Экран после «Выхода», если браузер не дал закрыть вкладку -->
<section id="bye" class="screen">
  <div class="logo">
    <h1>A-A-A-A</h1>
    <div class="ribbon">Match 3 RPG</div>
  </div>
  <div class="panel">
    <p class="hint">Игра закрыта. Можно закрыть вкладку.</p>
    <button id="btnReturn" class="btn green" type="button">Вернуться</button>
  </div>
</section>

<div id="changelog" class="modal">
  <div class="modalBox">
    <div class="ribbon">Список изменений</div>
    <div class="panel">
      <button id="changelogClose" class="btn red round close" type="button" aria-label="Закрыть"></button>
      <div id="changelogList"></div>
    </div>
  </div>
</div>

<!-- Подсказка «Фишки»: что даёт каждая фишка в бою -->
<div id="gemLegend" class="modal">
  <div class="modalBox">
    <div class="ribbon">Фишки</div>
    <div class="panel">
      <button id="gemLegendClose" class="btn red round close" type="button" aria-label="Закрыть"></button>
      <div id="gemLegendList"></div>
      <div class="legendFoot">
        <p id="gemLegendNote"></p>
        <button id="gemLegendMore" class="btn stone" type="button">Весь глоссарий</button>
      </div>
    </div>
  </div>
</div>

<div id="confirm" class="modal">
  <div class="modalBox">
    <div class="panel">
      <p id="confirmText"></p>
      <div class="confirmButtons">
        <button id="confirmNo" class="btn stone" type="button">Отмена</button>
        <button id="confirmYes" class="btn red" type="button"></button>
      </div>
    </div>
  </div>
</div>

<div id="battleResult" class="modal">
  <div class="modalBox">
    <div class="ribbon" id="resultTitle"></div>
    <div class="panel">
      <ul id="resultList"></ul>
      <div class="confirmButtons">
        <button id="resultMap" class="btn stone" type="button">Карта</button>
        <button id="resultAgain" class="btn green" type="button">Ещё раз</button>
      </div>
    </div>
  </div>
</div>

<!-- Своя клавиатура для имени на телефоне (системная не поворачивается вместе с игрой) -->
<div id="keyboard" class="modal">
  <div class="kbBox">
    <div id="kbValue" class="kbValue"></div>
    <div id="kbKeys"></div>
  </div>
</div>

<div id="toast"></div>
