<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>A-A-A-A Match 3 RPG</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1C1620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Главное меню -->
<section id="menu" class="screen active">
  <div class="logo">
    <h1>A-A-A-A</h1>
    <div class="ribbon">Match 3 RPG</div>
  </div>
  <nav class="menuButtons">
    <div id="heroCard" class="heroCard" hidden>
      <div class="heroCardHead"><b id="heroCardName"></b><span id="heroCardSlot"></span></div>
      <dl id="heroCardStats"></dl>
    </div>
    <button id="btnStart" class="btn green big" type="button">
      <span id="btnStartLabel">Начать игру</span>
      <small id="btnStartSub"></small>
    </button>
    <button id="btnCharacters" class="btn stone" type="button">Персонажи</button>
    <button id="btnSettings" class="btn stone" type="button">Настройки</button>
    <button id="btnExit" class="btn red" type="button">Выход</button>
  </nav>
  <button id="ver" type="button"></button>
</section>

<!-- Персонажи: три ячейки -->
<section id="characters" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
    <div class="ribbon">Персонажи</div>
  </header>
  <div class="panel">
    <p class="hint">Выберите персонажа или создайте нового</p>
    <div id="slotList"></div>
  </div>
</section>

<!-- Создание персонажа: по экрану на шаг (шаги — js/createSteps.js) -->
<section id="create" class="screen">
  <header class="createHead">
    <div class="ribbon" id="createTitle"></div>
    <span id="createProgress"></span>
  </header>
  <div class="panel">
    <p class="hint" id="createHint"></p>
    <div id="createBody"></div>
  </div>
  <footer class="createNav">
    <button id="createBack" class="btn stone" type="button">Назад</button>
    <button id="createNext" class="btn green" type="button">Далее</button>
  </footer>
</section>

<!-- Настройки -->
<section id="settings" class="screen">
  <header class="screenHead">
    <button class="btn stone round back" type="button" data-back aria-label="Назад"></button>
    <div class="ribbon">Настройки</div>
  </header>
  <div class="panel">
    <div class="settingsList">
      <label class="setRow range"><span>Музыка <b id="val-music"></b></span><input id="set-music" type="range" min="0" max="100" step="5"></label>
      <label class="setRow range"><span>Звуки <b id="val-sound"></b></span><input id="set-sound" type="range" min="0" max="100" step="5"></label>
      <label class="setRow"><span>Вибрация</span><input id="set-vibration" type="checkbox" class="switch"></label>
      <label class="setRow"><span>Полноэкранный режим</span><input id="set-fullscreen" type="checkbox" class="switch"></label>
      <label class="setRow"><span>Оповещения</span><input id="set-notifications" type="checkbox" class="switch"></label>
    </div>
    <button id="btnResetSaves" class="btn red" type="button">Удалить всех персонажей</button>
  </div>
</section>

<!-- Игра (пока заглушка) -->
<section id="game" class="screen">
  <header class="gameHead">
    <b id="gameHeroName"></b>
    <span id="gameHeroInfo"></span>
  </header>
  <div class="boardWrap">
    <div id="board" class="board">
      <div id="boardCells"></div>
      <div id="boardGems"></div>
    </div>
  </div>
  <!-- Временно, пока нет игрового меню: выход в главное меню -->
  <footer class="createNav">
    <button id="gameToMenu" class="btn stone" type="button" data-back>В главное меню</button>
  </footer>
</section>

<!-- Шуточная заставка после создания персонажа (текст — js/introText.js) -->
<section id="intro" class="screen">
  <div id="introStars"></div>
  <div class="introView"><div id="introCrawl"></div></div>
  <button id="introSkip" class="btn stone" type="button">Пропустить</button>
</section>

<!-- Экран после «Выхода», если браузер не дал закрыть вкладку -->
<section id="bye" class="screen">
  <div class="logo">
    <h1>A-A-A-A</h1>
    <div class="ribbon">Match 3 RPG</div>
  </div>
  <div class="panel">
    <p class="hint">Игра закрыта. Можно закрыть вкладку.</p>
    <button id="btnReturn" class="btn green" type="button">Вернуться</button>
  </div>
</section>

<div id="changelog" class="modal">
  <div class="modalBox">
    <div class="ribbon">Список изменений</div>
    <div class="panel">
      <button id="changelogClose" class="btn red round close" type="button" aria-label="Закрыть"></button>
      <div id="changelogList"></div>
    </div>
  </div>
</div>

<div id="confirm" class="modal">
  <div class="modalBox">
    <div class="panel">
      <p id="confirmText"></p>
      <div class="confirmButtons">
        <button id="confirmNo" class="btn stone" type="button">Отмена</button>
        <button id="confirmYes" class="btn red" type="button"></button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
